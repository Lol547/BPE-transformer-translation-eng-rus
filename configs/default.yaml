data:
  url: "https://www.manythings.org/anki/rus-eng.zip"
  train_split: 0.85
  val_split: 0.075
  test_split: 0.075
  sequence_length: 96
  vocab_size: 30000

model:
  hidden_dim: 384
  intermediate_dim: 1024
  num_heads: 8
  num_layers: 5
  dropout: 0.2

training:
  batch_size: 64
  epochs: 40
  warmup_steps: 10000
  clip_grad: 1.0
  label_smoothing: 0.1

device: "cuda"

seed: 42
